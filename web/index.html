<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <meta name="theme-color" content="#2a2a33" />

      content="A board editor for architecture diagrams: drag blocks onto a canvas, wire them together, and see what the model review flags."
    />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <title>Archmage board</title>
  </head>
  <body>
    <div id="root"></div>

    <script type="module" src="/src/main.tsx"></script>
  </body>
