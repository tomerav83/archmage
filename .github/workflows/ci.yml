name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run check
      # Fails under the thresholds in vite.config.ts; the table prints in the log.
      - run: npm run test:coverage
      # tsc runs here too, so there is no separate typecheck step.
      - run: npm run build
